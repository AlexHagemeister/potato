name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's stale run. Each push to main gets its
# own group (by commit SHA), so no main run is ever cancelled, running or
# queued. One shared main group would not do: GitHub keeps at most one pending
# run per group and cancels it when a newer one queues, so a third quick merge
# would leave the second without a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node runs next build. Same major as production, from engines.node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      # The second hash covers every build input, not only src/: the public
      # assets and the config files next build reads.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Typecheck stays separate from the build's own TypeScript pass: it also
      # covers test files (tsconfig.test.json), which next build skips, and it
      # fails fast before the slower build step.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
